name: Deploy Hack-Search

on:
  schedule:
    # Every day at 06:30 UTC (~12:00 IST)
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # Don't cancel in-flight Pages deploys — that surfaces as "Deployment cancelled."
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape hackathons
        run: python scrape.py

      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp output/hackathons.html site/index.html
          cp output/hackathons.json site/hackathons.json
          cp output/hackathons.html site/hackathons.html
          cp assets/logo.png site/logo.png
          cp assets/logo.png output/logo.png

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
