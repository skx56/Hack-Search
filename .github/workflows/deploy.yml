name: Deploy Hack-Search

on:
  schedule:
    # Every day at 06:30 UTC (~12:00 IST)
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape hackathons
        run: python scrape.py

      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp output/hackathons.html site/index.html
          cp output/hackathons.json site/hackathons.json
          cp output/hackathons.html site/hackathons.html
          cp assets/logo.png site/logo.png
          cp assets/logo.png output/logo.png
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
